{% include "layout_top.html" %}
<div{% if fe == "alpine" %} x-data="dashboard"{% endif %}>
<div class="dash-head">
  <h1>Analitik</h1>
  <form class="range-form" method="get" action="/{{ fe }}/dashboard"{% if fe == "htmx" %} hx-get="/{{ fe }}/dashboard" hx-target="#dashboard-body" hx-swap="outerHTML" hx-push-url="true" hx-trigger="submit, change"{% endif %}{% if fe == "alpine" %} @submit.prevent="load()"{% endif %}>
    <select name="range" data-testid="range-select"{% if fe == "alpine" %} x-model="range" @change="load()"{% endif %}>
{% for r in ranges %}
      <option value="{{ r.value }}"{% if r.selected %} selected{% endif %}>{{ r.label }}</option>
{% endfor %}
    </select>
    <button type="submit">Uygula</button>
  </form>
</div>
{% include "dashboard_body.html" %}
</div>
{% include "layout_bottom.html" %}
